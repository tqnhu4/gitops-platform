apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/company/gitops-platform
    targetRevision: HEAD
    path: helm-charts/auth
    helm:
      valueFiles:
        - ../../environments/dev/values/auth-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true