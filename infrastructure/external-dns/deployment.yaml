apiVersion: apps/v1
kind: Deployment

metadata:
  name: external-dns
  namespace: external-dns

spec:
  replicas: 1

  selector:
    matchLabels:
      app: external-dns

  template:
    metadata:
      labels:
        app: external-dns

    spec:
      serviceAccountName: external-dns

      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.14.0

          args:
            # 🔥 ONLY ingress
            - --source=ingress

            # 🔥 ONLY demo namespace
            - --namespace=demo

            - --provider=inmemory

            - --registry=txt
            - --txt-owner-id=local

            - --policy=upsert-only

            - --request-timeout=10m

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 300m
              memory: 256Mi